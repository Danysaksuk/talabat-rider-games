# Render Blueprint: one Node web service + one Postgres database.
services:
  - type: web
    name: talabat-rider-games
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: ADMIN_PIN
        sync: false        # set in the Render dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: rider-games-db
          property: connectionString
databases:
  - name: rider-games-db
    plan: free
    databaseName: rider_games
